# 云端自动编译 Debug APK（无需本机安装 Android Studio）
# 用法：
#   1. 把整个 WeChatStudentLookup 目录推到 GitHub 私有仓库
#   2. 仓库 → Settings → Actions → 允许运行
#   3. 每次 push 到 main 会自动编译，或在 Actions 页点 "Run workflow" 手动触发
#   4. 编译完成后在 Actions → Artifacts 下载 app-debug-apk.zip，解压即得 app-debug.apk
#
# 说明：GitHub 托管的 ubuntu runner 已预装 Android SDK（含 cmdline-tools/latest）
#       并预接受了许可证；不再使用 android-actions/setup-android（其与新版
#       cmdline-tools 不兼容，--licenses 会变成交互式导致 CI 卡死）。

name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
