# 云端自动编译 Debug APK（无需本机安装 Android Studio）
# 用法：
#   1. 把整个 WeChatStudentLookup 目录推到 GitHub 私有仓库
#   2. 仓库 → Settings → Actions → 允许运行
#   3. 每次 push 到 main/master 会自动编译，或在 Actions 页点 "Run workflow" 手动触发
#   4. 编译完成后在 Actions → Artifacts 下载 app-debug-apk.zip，解压即得 app-debug.apk

name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # 工程未内置 gradle wrapper jar，用 gradle-build-action 指定版本下载并构建
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
